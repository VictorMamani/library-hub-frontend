<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#ffffff"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/book.svg"
    />
    <meta
      name="description"
      content="Consulta el catálogo y gestiona tus préstamos en Library Hub, tu biblioteca universitaria."
    />
    <title>Library Hub | Biblioteca universitaria</title>
    <script>
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const saved = localStorage.getItem('library-hub-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {
          // La preferencia del sistema sirve cuando no hay almacenamiento disponible.
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#181923' : '#ffffff';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
